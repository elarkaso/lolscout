<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07152A"/><stop offset="1" stop-color="#0C2E3A"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#grid)"/>
  <polyline points="860,120 940,90 1010,130 1090,60 1180,85 1250,40" fill="none" stroke="#5EEAD4" stroke-opacity=".18" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <svg x="110" y="80" width="240" height="240" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="lsbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/><stop offset="1" stop-color="#123B4A"/>
    </linearGradient>
    <linearGradient id="lsbar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#5EEAD4"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#lsbg)"/>
  <!-- sloupcový graf (statistiky) -->
  <g transform="translate(58 150)">
    <rect x="0"  y="-30" width="20" height="30" rx="4" fill="url(#lsbar)" opacity=".55"/>
    <rect x="28" y="-58" width="20" height="58" rx="4" fill="url(#lsbar)" opacity=".75"/>
    <rect x="56" y="-44" width="20" height="44" rx="4" fill="url(#lsbar)" opacity=".65"/>
    <rect x="84" y="-80" width="20" height="80" rx="4" fill="url(#lsbar)"/>
  </g>
  <!-- lupa (scouting) -->
  <circle cx="122" cy="112" r="62" fill="#fff" fill-opacity=".06" stroke="#FBBF24" stroke-width="12"/>
  <line x1="168" y1="158" x2="206" y2="196" stroke="#FBBF24" stroke-width="18" stroke-linecap="round"/>
  <!-- trend -->
  <polyline points="70,128 98,104 126,116 160,78" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="160" cy="78" r="7" fill="#fff"/>
</svg>
  <text x="410" y="190" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="112" font-weight="800" fill="#fff" letter-spacing="-2">lol<tspan fill="#FBBF24">scout</tspan></text>
  <text x="414" y="250" font-family="ui-sans-serif,-apple-system,'Segoe UI',Inter,Helvetica,Arial,sans-serif" font-size="32" fill="#BFDBFE">Scouting soupeřů přes oficiální Riot API</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" fill="#E0F2FE"><rect x="414" y="282" width="114" height="40" rx="20" fill="#fff" fill-opacity=".09" stroke="#5EEAD4" stroke-opacity=".35"/><text x="438" y="309">rank</text><rect x="540" y="282" width="128" height="40" rx="20" fill="#fff" fill-opacity=".09" stroke="#5EEAD4" stroke-opacity=".35"/><text x="564" y="309">forma</text><rect x="680" y="282" width="172" height="40" rx="20" fill="#fff" fill-opacity=".09" stroke="#5EEAD4" stroke-opacity=".35"/><text x="704" y="309">championi</text><rect x="864" y="282" width="104" height="40" rx="20" fill="#fff" fill-opacity=".09" stroke="#5EEAD4" stroke-opacity=".35"/><text x="888" y="309">bany</text><rect x="980" y="282" width="142" height="40" rx="20" fill="#fff" fill-opacity=".09" stroke="#5EEAD4" stroke-opacity=".35"/><text x="1004" y="309">mastery</text></g>
</svg>
